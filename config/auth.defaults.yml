# Safe, non-secret defaults for local development.
# Override via environment variables or external config. Do not commit real secrets.

auth:
  env:
    jwt_secret: ${AUTH_JWT_SECRET:-"CHANGE_ME_SUPER_SECRET"}
    db_url: ${AUTH_DB_URL:-"jdbc:postgresql://localhost:5432/kol_auth"}
    db_user: ${AUTH_DB_USER:-"kol_auth"}
    db_password: ${AUTH_DB_PASSWORD:-"kol_dev_password"}

  tokens:
    issuer: ${AUTH_JWT_ISSUER:-"https://auth.local.dev"}
    audience: ${AUTH_JWT_AUDIENCE:-"kol-clients"}
    algorithm: ${AUTH_JWT_ALG:-"HS256"}
    access_ttl_seconds: ${AUTH_ACCESS_TTL_SECONDS:-900}
    refresh_ttl_seconds: ${AUTH_REFRESH_TTL_SECONDS:-1209600}
    refresh_rotation: ${AUTH_REFRESH_ROTATION:-"rotate"}

  hashing:
    algorithm: "argon2id"
    argon2:
      iterations: ${ARGON2_TIME:-3}
      memory_kib: ${ARGON2_MEMORY_KIB:-65536}
      parallelism: ${ARGON2_PARALLELISM:-1}
      salt_length: 16
      hash_length: 32
      pepper_env: ${ARGON2_PEPPER_ENV:-"AUTH_PASSWORD_PEPPER"}

  database:
    schema: "auth"
    user_table: "users"
    session_table: "refresh_tokens"

  wallet:
    challenge_ttl_seconds: ${AUTH_WALLET_CHALLENGE_TTL:-300}
    algorithm: ${AUTH_WALLET_ALGO:-"ed25519"}

guidance:
  secrets: "Keep secrets in env/.env, never in git."
  migrations: "auth-server runs Flyway migrations on startup; you can also run ./gradlew :auth-server:flywayMigrate manually."
