services:
  postgres:
    image: postgres:18
    container_name: kol-auth-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kol_auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kol_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kol_auth}
    volumes:
      - kol-auth-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kol_auth -d kol_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kol-auth-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/kol_auth
      AUTH_DB_USER: ${POSTGRES_USER:-kol_auth}
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD:-kol_dev_password}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-CHANGE_ME_SUPER_SECRET}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-kol-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-kol-clients}
      AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-900}
      AUTH_REFRESH_TTL_SECONDS: ${AUTH_REFRESH_TTL_SECONDS:-604800}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  kol-auth-data:
